[package]
name = "ai-cli-editor"
version = "0.1.0"
description = "The lightweight editor for Codex, Claude Code, Gemini CLI and coding agents."
authors = ["AI CLI Editor contributors"]
license = "Apache-2.0"
repository = "https://github.com/ai-cli-editor/ai-cli-editor"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ai_cli_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
notify = "8"
portable-pty = "0.9"
ignore = "0.4"
base64 = "0.22"
similar = "2"

[profile.dev]
incremental = true

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
