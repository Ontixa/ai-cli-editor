[package]
name = "ai-cli-editor"
version = "0.3.0"
description = "The control plane, cockpit, and review surface for terminal-native coding agents."
authors = ["AI CLI Editor contributors"]
license = "Apache-2.0"
repository = "https://github.com/ai-cli-editor/ai-cli-editor"
edition = "2021"
rust-version = "1.77.2"

# Desktop-first crate: "rlib" is what the app binary links; "staticlib"
# keeps the iOS/mobile option open. "cdylib" is intentionally omitted — it
# is only needed for Android, and on x86_64-pc-windows-gnu it fails to link
# ("export ordinal too large"), which breaks `cargo test`/`cargo build` on
# Windows machines using the GNU toolchain (no MSVC required).
[lib]
name = "ai_cli_editor_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
notify = "8"
portable-pty = "0.9"
ignore = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
base64 = "0.22"
similar = "2"
sysinfo = "0.33"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[profile.dev]
incremental = true

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
